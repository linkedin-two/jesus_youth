[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_USER,VITE_ADMIN_PASS,VITE_ADMIN_KEY,VITE_UPI_QR_URL,VITE_COORDINATOR_1_NAME,VITE_COORDINATOR_2_NAME,VITE_COORDINATOR_1_PHONE,VITE_COORDINATOR_2_PHONE,VITE_UPI_ID,VITE_UPI_ACCOUNT_NAME,VITE_API_BASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
