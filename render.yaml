services:
  # 🐍 Python FastAPI Backend Web Service
  - type: web
    name: jesus-youth-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        sync: false
      - key: DB_NAME
        value: jesus_youth
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false

  # ⚡ React Frontend Static Site
  - type: static
    name: jesus-youth-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jesus-youth-backend
          property: url
      - key: VITE_ADMIN_USER
        sync: false
      - key: VITE_ADMIN_PASS
        sync: false
      - key: VITE_ADMIN_KEY
        sync: false
      - key: VITE_UPI_ID
        sync: false
      - key: VITE_UPI_ACCOUNT_NAME
        sync: false
      - key: VITE_UPI_QR_URL
        sync: false
      - key: VITE_COORDINATOR_1_NAME
        sync: false
      - key: VITE_COORDINATOR_1_PHONE
        sync: false
      - key: VITE_COORDINATOR_2_NAME
        sync: false
      - key: VITE_COORDINATOR_2_PHONE
        sync: false
